name: Build firmware
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32s3
          command: idf.py build && idf.py merge-bin -o ramses_esp-merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ramses_esp-0.5.3-wdfix1
          path: |
            build/ramses_esp-merged.bin
            build/ramses_esp.bin
